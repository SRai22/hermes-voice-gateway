<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Voice Gateway — Local Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0b0c10;
    color: #c5c6c7;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 24px;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #666;
    text-align: center;
    margin-bottom: 24px;
  }
  .card {
    background: #1a1b1e;
    border: 1px solid #2d2e32;
    border-radius: 16px;
    padding: 24px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4a4b4d;
  }
  .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-dot.connecting { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    transition: all 0.2s;
  }
  .btn.connect {
    background: #22c55e;
    color: #ffffff;
  }
  .btn.connect:disabled { background: #4a4b4d; color: #888; cursor: not-allowed; }
  .btn.disconnect {
    background: #ef4444;
    color: #ffffff;
    display: none;
  }
  .btn.mute {
    background: #2d2e32;
    color: #c5c6c7;
    border: 1px solid #4a4b4d;
    display: none;
  }
  .btn.mute.active { background: #ef4444; }
  .audio-meters {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .meter {
    flex: 1;
    height: 6px;
    background: #2d2e32;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  .meter-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
    transition: width 0.05s;
  }
  .meter-fill.remote { background: #3b82f6; }
  .label {
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .transcript {
    background: #0d0e11;
    border: 1px solid #2d2e32;
    border-radius: 12px;
    padding: 16px;
    font-size: 1rem;
    color: #c5c6c7;
    min-height: 60px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .volume-control {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  input[type=range] {
    width: 100%;
    accent-color: #22c55e;
  }
  .debug {
    margin-top: 24px;
    padding: 12px;
    background: #0d0e11;
    border: 1px solid #2d2e32;
    border-radius: 8px;
    font-size: 0.7rem;
    color: #666;
    font-family: monospace;
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }
  .debug.show { display: block; }
  .debug-line {
    margin-bottom: 4px;
    padding: 2px 0;
    border-bottom: 1px solid #1a1b1e;
  }
  .error-msg {
    color: #ef4444;
    font-size: 0.85rem;
    margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Hermes Voice</h1>
  <div class="subtitle">Local Pipecat pipeline · ElevenLabs STT/TTS · OpenAI LLM</div>

  <div class="card">
    <div class="status" id="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div id="audioDiagnostic" style="color:#9ca3af;font-size:.78rem;line-height:1.5;margin-bottom:14px;">Microphone and RTP not tested.</div>

    <button class="btn connect" id="connectBtn">Connect to Pipeline</button>
    <button class="btn disconnect" id="disconnectBtn">Disconnect</button>
    <button class="btn mute" id="muteBtn">Mute Microphone</button>

    <div class="audio-meters">
      <div>
        <div class="label">Microphone</div>
        <div class="meter"><div class="meter-fill" id="localMeter"></div></div>
      </div>
      <div>
        <div class="label">Speaker</div>
        <div class="meter"><div class="meter-fill remote" id="remoteMeter"></div></div>
      </div>
    </div>

    <div class="controls">
      <div class="volume-control">
        <div class="label">Volume</div>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
      </div>
    </div>

    <div class="transcript" id="transcript">Say something after connecting...</div>
  </div>

  <div class="debug" id="debug">
    <div class="label">WebRTC / Audio Diagnostics</div>
    <div id="debugLog"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const SIGNALING_URL = window.location.origin;
  const connectBtn = $('connectBtn'), disconnectBtn = $('disconnectBtn');
  const muteBtn = $('muteBtn'), statusDot = $('statusDot'), statusText = $('statusText');
  const errorMsg = $('errorMsg'), transcript = $('transcript');
  const localMeter = $('localMeter'), remoteMeter = $('remoteMeter');
  const volumeInput = $('volume'), debugLog = $('debugLog'), debug = $('debug');
  const audioDiagnostic = $('audioDiagnostic');

  let pc = null, dataChannel = null, localStream = null, remoteAudio = null;
  let audioCtx = null, localAnalyser = null, remoteAnalyser = null;
  let localSource = null, remoteSource = null;
  let meterAnimation = null, statsTimer = null;
  let connectionId = null, isMuted = false, connecting = false;
  let previousSentPackets = null, previousReceivedPackets = null;

  function log(message) {
    const line = document.createElement('div');
    line.className = 'debug-line';
    line.textContent = new Date().toLocaleTimeString() + ' ' + message;
    debugLog.appendChild(line);
    debugLog.scrollTop = debugLog.scrollHeight;
    console.log('[Hermes]', message);
  }
  function setStatus(state, message) {
    statusDot.className = 'status-dot ' + state;
    statusText.textContent = message;
  }
  function setError(message) {
    errorMsg.textContent = message;
    errorMsg.style.display = message ? 'block' : 'none';
  }
  function setButtons(connected) {
    connectBtn.style.display = connected ? 'none' : 'block';
    connectBtn.disabled = connecting;
    disconnectBtn.style.display = connected ? 'block' : 'none';
    muteBtn.style.display = connected ? 'block' : 'none';
  }
  function setDiagnostic(message) { audioDiagnostic.textContent = message; }

  // Shared Web Audio context for real microphone AND speaker meters.
  async function createLocalMeter() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      localAnalyser = audioCtx.createAnalyser();
      localAnalyser.fftSize = 512;
      localSource = audioCtx.createMediaStreamSource(localStream);
      localSource.connect(localAnalyser); // Never connect the mic to speakers.
      renderMeters();
    } catch (error) { log('Mic meter unavailable: ' + error.message); }
  }
  function meterLevel(analyser) {
    if (!analyser) return 0;
    const values = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(values);
    let energy = 0;
    for (const value of values) {
      const amplitude = (value - 128) / 128;
      energy += amplitude * amplitude;
    }
    const rms = Math.sqrt(energy / values.length);
    return Math.min(100, Math.round(rms * 450));
  }
  function renderMeters() {
    localMeter.style.width = meterLevel(localAnalyser) + '%';
    remoteMeter.style.width = meterLevel(remoteAnalyser) + '%';
    meterAnimation = requestAnimationFrame(renderMeters);
  }
  function configureRemoteAudio(event) {
    if (event.track.kind !== 'audio') return;
    log('Remote audio track: state=' + event.track.readyState + ', muted=' + event.track.muted);
    const stream = event.streams?.[0] || new MediaStream([event.track]);
    if (!remoteAudio) {
      remoteAudio = new Audio();
      remoteAudio.autoplay = true;
      remoteAudio.playsInline = true;
      remoteAudio.volume = Number(volumeInput.value);
    }
    remoteAudio.srcObject = stream;
    remoteAudio.play().catch(err => log('Remote playback blocked: ' + err.message));
    if (audioCtx) {
      try {
        if (remoteSource) remoteSource.disconnect();
        remoteAnalyser = audioCtx.createAnalyser();
        remoteAnalyser.fftSize = 512;
        remoteSource = audioCtx.createMediaStreamSource(stream);
        remoteSource.connect(remoteAnalyser); // Meter only, audio plays via <audio>.
      } catch (err) { log('Speaker meter unavailable: ' + err.message); }
    }
  }

  // The browser must create the SCTP data channel before createOffer().
  function createPeerConnection() {
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    dataChannel = pc.createDataChannel('rtvi-ai');
    dataChannel.onopen = () => log('RTVI data channel OPEN');
    dataChannel.onclose = () => log('RTVI data channel CLOSED');
    dataChannel.onerror = () => log('RTVI data channel ERROR');
    dataChannel.onmessage = event => {
      // RTVI events are JSON and require protocol-aware handling for full transcripts.
      // Do not mistake an empty transcript UI for a failed audio transport.
      try {
        const message = JSON.parse(event.data);
        log('RTVI message: ' + String(message.type || message.label || 'untyped'));
      } catch { log('RTVI message received (non-JSON)'); }
    };
    pc.onconnectionstatechange = () => {
      if (!pc) return;
      log('Peer connection: ' + pc.connectionState);
      if (pc.connectionState === 'connected') {
        setStatus('connected', 'WebRTC connected — checking audio RTP');
        setButtons(true);
      } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        setStatus('error', 'WebRTC ' + pc.connectionState);
        setError('Peer connection ' + pc.connectionState + '. Press Disconnect, then reconnect.');
      }
    };
    pc.oniceconnectionstatechange = () => log('ICE state: ' + pc.iceConnectionState);
    pc.ontrack = configureRemoteAudio;
    return pc;
  }

  function waitForIceGathering(peer, timeoutMs = 10000) {
    if (peer.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        peer.removeEventListener('icegatheringstatechange', onChange);
        reject(new Error('Timed out waiting for ICE candidates'));
      }, timeoutMs);
      function onChange() {
        if (peer.iceGatheringState === 'complete') {
          clearTimeout(timeout);
          peer.removeEventListener('icegatheringstatechange', onChange);
          resolve();
        }
      }
      peer.addEventListener('icegatheringstatechange', onChange);
    });
  }

  async function inspectAudioStats() {
    if (!pc || pc.connectionState !== 'connected') return;
    const track = localStream?.getAudioTracks()[0];
    const sender = pc.getSenders().find(s => s.track?.kind === 'audio');
    const transceiver = pc.getTransceivers().find(t => t.sender === sender);
    let outbound = null, inbound = null, micLevel = null;
    const stats = await pc.getStats();
    stats.forEach(r => {
      if (r.type === 'outbound-rtp' && !r.isRemote && (r.kind === 'audio' || r.mediaType === 'audio')) outbound = r;
      if (r.type === 'inbound-rtp' && !r.isRemote && (r.kind === 'audio' || r.mediaType === 'audio')) inbound = r;
      if (r.type === 'media-source' && r.kind === 'audio') micLevel = r.audioLevel;
    });
    const sent = outbound?.packetsSent ?? null;
    const received = inbound?.packetsReceived ?? null;
    const deltaSent = sent === null || previousSentPackets === null ? null : sent - previousSentPackets;
    const deltaReceived = received === null || previousReceivedPackets === null ? null : received - previousReceivedPackets;
    previousSentPackets = sent;
    previousReceivedPackets = received;
    const details = [
      'Mic: ' + (track ? `${track.readyState}, enabled=${track.enabled}, muted=${track.muted}` : 'MISSING'),
      'send direction: ' + (transceiver?.currentDirection || 'unknown'),
      'RTP sent: ' + (sent ?? 'not reported') + ' (+' + (deltaSent ?? '?') + '/2s)',
      'RTP received: ' + (received ?? 'not reported') + ' (+' + (deltaReceived ?? '?') + '/2s)',
      'mic audioLevel: ' + (micLevel == null ? 'n/a' : micLevel.toFixed(3))
    ];
    setDiagnostic(details.join(' | '));
    log(details.join(' | '));
    if (deltaSent !== null && deltaSent > 0) {
      setStatus('connected', 'WebRTC connected — microphone RTP sending');
    } else if (deltaSent === 0) {
      setStatus('error', 'Connected, but microphone RTP not increasing');
    }
  }
  function startStats() {
    if (statsTimer) clearInterval(statsTimer);
    previousSentPackets = null;
    previousReceivedPackets = null;
    statsTimer = setInterval(() => {
      inspectAudioStats().catch(err => log('RTP stats error: ' + err.message));
    }, 2000);
  }

  async function connect() {
    if (connecting || pc) return;
    connecting = true;
    setButtons(false);
    setStatus('connecting', 'Requesting microphone...');
    setError('');
    setDiagnostic('Starting microphone capture...');
    try {
      // Browser negotiates the Opus RTP codec; do not force 16 kHz capture.
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      const mic = localStream.getAudioTracks()[0];
      if (!mic) throw new Error('Browser did not return an audio track');
      log('Microphone captured: ' + mic.label + ', state=' + mic.readyState);
      mic.onended = () => log('Microphone track ENDED');
      mic.onmute = () => log('Microphone track MUTED by source');
      mic.onunmute = () => log('Microphone track UNMUTED by source');
      await createLocalMeter();
      createPeerConnection();
      pc.addTrack(mic, localStream);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      // Complete ICE gathering before sending the offer: no trickle endpoint required.
      await waitForIceGathering(pc);
      const localSdp = pc.localDescription.sdp;
      log('Offer has audio=' + localSdp.includes('m=audio') + ', data=' + localSdp.includes('m=application'));
      setStatus('connecting', 'Negotiating with pipeline...');

      const connResp = await fetch(SIGNALING_URL + '/connections');
      if (!connResp.ok) throw new Error('GET /connections failed: HTTP ' + connResp.status);
      const connData = await connResp.json();
      const connections = connData.connections || [];
      if (connections.length !== 1) {
        throw new Error(`Expected exactly one active pipeline connection; found ${connections.length}. Backend must select the correct PipelineTask connection.`);
      }
      connectionId = connections[0];
      log('Pipeline connection ID: ' + connectionId);
      const response = await fetch(SIGNALING_URL + '/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ connectionId, sdp: localSdp, type: 'offer' })
      });
      if (!response.ok) throw new Error('POST /offer failed: HTTP ' + response.status + ' ' + await response.text());
      const answer = await response.json();
      if (!answer?.sdp || answer.type !== 'answer') throw new Error('Invalid SDP answer from /offer');
      log('Answer has audio=' + answer.sdp.includes('m=audio') + ', data=' + answer.sdp.includes('m=application'));
      if (answer.connectionId && answer.connectionId !== connectionId) {
        throw new Error('Signaling returned a different connection ID than requested');
      }
      await pc.setRemoteDescription({ type: answer.type, sdp: answer.sdp });
      log('Remote description applied');
      startStats();
      setDiagnostic('Waiting for peer connection and first audio RTP measurements...');
    } catch (error) {
      log('Connect error: ' + error.message);
      cleanup();
      setStatus('error', 'Connection failed');
      setError(error.message);
    } finally {
      connecting = false;
      connectBtn.disabled = false;
    }
  }

  function cleanup() {
    if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    if (meterAnimation !== null) { cancelAnimationFrame(meterAnimation); meterAnimation = null; }
    if (dataChannel) { dataChannel.close(); dataChannel = null; }
    if (pc) { pc.ontrack = null; pc.onconnectionstatechange = null; pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    if (remoteAudio) { remoteAudio.pause(); remoteAudio.srcObject = null; remoteAudio = null; }
    if (localSource) { localSource.disconnect(); localSource = null; }
    if (remoteSource) { remoteSource.disconnect(); remoteSource = null; }
    localAnalyser = null;
    remoteAnalyser = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    localMeter.style.width = '0%';
    remoteMeter.style.width = '0%';
    connectionId = null;
    isMuted = false;
    muteBtn.classList.remove('active');
    muteBtn.textContent = 'Mute Microphone';
    previousSentPackets = previousReceivedPackets = null;
    setButtons(false);
  }
  function disconnect() {
    cleanup();
    setStatus('disconnected', 'Disconnected');
    setError('');
    setDiagnostic('Microphone and RTP not tested.');
    transcript.textContent = 'Say something after connecting...';
  }
  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    localStream?.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
    muteBtn.classList.toggle('active', isMuted);
    muteBtn.textContent = isMuted ? 'Unmute Microphone' : 'Mute Microphone';
    log('Microphone ' + (isMuted ? 'disabled' : 'enabled'));
  });
  volumeInput.addEventListener('input', () => {
    if (remoteAudio) remoteAudio.volume = Number(volumeInput.value);
  });
  connectBtn.addEventListener('click', connect);
  disconnectBtn.addEventListener('click', disconnect);
  document.body.addEventListener('keydown', event => {
    if ((event.key === 'd' || event.key === 'D') && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
      debug.classList.toggle('show');
    }
  });
  setStatus('disconnected', 'Disconnected');
  setButtons(false);
  log('Frontend ready; signaling at ' + SIGNALING_URL + '; press D for diagnostics.');
})();
</script>
</body>
</html>

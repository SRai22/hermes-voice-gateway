name: hermes-voice-gateway
version: "0.2.0"
manifest_version: 2
api_version: 1
description: "Voice platform for Hermes: answers Twilio phone calls, speaks Hermes' replies with ElevenLabs, and (planned) places operator-approved callbacks. Includes a local WebRTC dev pipeline."
kind: platform
license: MIT
homepage: https://github.com/shravanrai/hermes-voice-gateway
tags: [voice, gateway, twilio, pipecat, phone, calls, elevenlabs]
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: Twilio Account SID
    password: true
  - name: TWILIO_AUTH_TOKEN
    description: Twilio Auth Token (also used to verify webhook signatures)
    password: true
  - name: ELEVENLABS_API_KEY
    description: ElevenLabs API key for speech-to-text and text-to-speech
    password: true
  - name: VOICE_WEBHOOK_URL
    description: "Public https base URL Twilio can reach (no trailing slash). Set the number's voice webhook to <this>/voice"
    password: false
optional_env:
  - name: VOICE_ALLOWED_USERS
    description: Comma-separated caller numbers (E.164) allowed to talk to Hermes. Required unless VOICE_ALLOW_ALL_USERS=true
    password: false
  - name: VOICE_ALLOW_ALL_USERS
    description: "true lets any caller in (not recommended)"
    password: false
  - name: VOICE_WEBHOOK_HOST
    description: Local bind address for the call server (default 127.0.0.1)
    password: false
  - name: VOICE_WEBHOOK_PORT
    description: Local port for the call server (default 8081)
    password: false
  - name: VOICE_MAX_CALL_SECONDS
    description: Longest a call may last before Hermes says goodbye and hangs up (default 1800; 0 = no limit)
    password: false
  - name: VOICE_MAX_CALLS
    description: Maximum simultaneous calls (default 5)
    password: false
  - name: VOICE_INSECURE_NO_SIGNATURE
    description: "true turns off Twilio signature checks. Local dev only"
    password: false
  - name: ELEVENLABS_VOICE_ID
    description: ElevenLabs voice for replies
    password: false
  - name: OPENAI_API_KEY
    description: Only for the local dev pipeline (voice_start_local_pipeline)
    password: true
  - name: TWILIO_PHONE_NUMBER
    description: Outbound caller ID (E.164). Required to dial approved callbacks
    password: false
provides_tools:
  - voice_propose_callback
  - voice_check_call_status
  - voice_start_local_pipeline
provides_hooks:
  - pre_tool_call
python_dependencies:
  - "pipecat-ai[elevenlabs,openai,silero,webrtc,websocket]>=1.7.0,<1.8.0"
  - "uvicorn>=0.32,<1"

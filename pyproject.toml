[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice-gateway"
version = "0.1.0"
description = "Pipecat-powered voice gateway connecting Hermes to business phone lines (Twilio Voice)."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shravan Rai"}]
keywords = ["hermes", "voice", "gateway", "twilio", "pipecat", "elevenlabs", "openai"]
dependencies = [
    "pipecat-ai>=0.5,<1.0",
    "openai>=1.0,<2",
    "twilio>=8,<9",
    "python-dotenv>=1.0,<2",
    "smallwebrtc>=0.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

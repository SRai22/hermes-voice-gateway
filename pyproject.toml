[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice-gateway"
version = "0.2.0"
description = "Hermes voice platform: Twilio phone calls handled by Hermes, with Pipecat and ElevenLabs."
requires-python = ">=3.11"  # pipecat-ai 1.7.0 needs 3.11+
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shravan Rai"}]
keywords = ["hermes", "voice", "gateway", "twilio", "pipecat", "elevenlabs", "openai"]
dependencies = [
    "pipecat-ai[elevenlabs,openai,silero,webrtc,websocket]==1.7.0",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.hatch.build]
only-include = [
    "plugin.yaml",
    "__init__.py",
    "schemas.py",
    "tools.py",
    "hooks.py",
    "pipeline.py",
    "voice_behavior.py",
    "adapter.py",
    "twilio_util.py",
    "_env.py",
    "README.md",
    "LICENSE",
]

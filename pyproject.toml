[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice-gateway"
version = "0.1.0"
description = "Pipecat-powered voice gateway connecting Hermes to business phone lines (Twilio Voice)."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shravan Rai"}]
keywords = ["hermes", "voice", "gateway", "twilio", "pipecat", "elevenlabs", "openai"]
dependencies = [
    "pipecat-ai>=1.7.0,<1.8.0",
    "openai>=1.0",
    "twilio>=8,<9",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.hatch.build]
only-include = [
    "plugin.yaml",
    "__init__.py",
    "schemas.py",
    "tools.py",
    "hooks.py",
    "pipeline.py",
    "README.md",
    "LICENSE",
]
